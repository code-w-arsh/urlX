<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="16" r="16" fill="#000000"/>
  
  <!-- First dot - teal gradient -->
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#168a8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a9b9f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- First dot -->
  <circle cx="7" cy="16" r="4" fill="url(#tealGradient)"/>
  
  <!-- Second dot - white -->
  <circle cx="16" cy="16" r="4" fill="#ffffff"/>
  
  <!-- Third dot - teal gradient -->
  <circle cx="25" cy="16" r="4" fill="url(#tealGradient)"/>
</svg>
